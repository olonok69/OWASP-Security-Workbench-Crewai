<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Agents and Crews Interaction Map</title>
  <desc id="desc">Diagram of crews in agents folder and how they interact through app usage and artifacts.</desc>

  <defs>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .group { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .h { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .t { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 11px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .edge { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .edgeSoft { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowSoft); }
      .noLink { stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 7 5; fill: none; }
    </style>

    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#334155"/>
    </marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="980" fill="#f8fafc"/>
  <text x="720" y="42" text-anchor="middle" class="title">agents/ — Crews, Agents, and Interaction Paths</text>
  <text x="720" y="66" text-anchor="middle" class="subtitle">Solid arrows = active integration; dashed links = no direct crew-to-crew calls</text>

  <!-- Lanes -->
  <rect x="30" y="95" width="420" height="300" rx="14" fill="#e0f2fe" stroke="#93c5fd"/>
  <text x="48" y="122" class="group">Usage Entry Points</text>

  <rect x="480" y="95" width="930" height="300" rx="14" fill="#ecfccb" stroke="#bef264"/>
  <text x="498" y="122" class="group">Core Crews in agents/</text>

  <rect x="30" y="420" width="1380" height="290" rx="14" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="48" y="447" class="group">Outputs, Artifacts, and Consumers</text>

  <rect x="30" y="735" width="1380" height="215" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="48" y="762" class="group">Agent-Level View (inside code_review_crew)</text>

  <!-- Usage entry boxes -->
  <rect x="60" y="145" width="360" height="95" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="78" y="170" class="h">Streamlit App (`app.py`)</text>
  <text x="78" y="189" class="t">• Uses `agents/code_review_crew/crew.py`</text>
  <text x="78" y="207" class="t">• Loads local JSON generated by other crews</text>
  <text x="78" y="225" class="t">• Shows reports in UI</text>

  <rect x="60" y="255" width="360" height="110" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="78" y="280" class="h">CLI / Terminal Usage</text>
  <text x="78" y="299" class="t">• `python agents/checksheet_crew/main.py`</text>
  <text x="78" y="317" class="t">• `python agents/top10_crew/main.py`</text>
  <text x="78" y="335" class="t">• `python agents/main.py`</text>
  <text x="78" y="353" class="t">• `agents/code_review_flow` (Flow runner)</text>

  <!-- Crew boxes -->
  <rect x="520" y="150" width="270" height="95" rx="10" fill="#ffffff" stroke="#bef264"/>
  <text x="538" y="175" class="h">checksheet_crew</text>
  <text x="538" y="194" class="t">2-agent extraction/validation</text>
  <text x="538" y="212" class="t">Input: CHEATSHEET_URL</text>
  <text x="538" y="230" class="t">Output: checksheet JSON</text>

  <rect x="820" y="150" width="270" height="95" rx="10" fill="#ffffff" stroke="#bef264"/>
  <text x="838" y="175" class="h">top10_crew</text>
  <text x="838" y="194" class="t">2-agent extraction/validation</text>
  <text x="838" y="212" class="t">Input: TOP10_URL</text>
  <text x="838" y="230" class="t">Output: top10 JSON</text>

  <rect x="1120" y="150" width="260" height="95" rx="10" fill="#ffffff" stroke="#bef264"/>
  <text x="1138" y="175" class="h">code_review_crew</text>
  <text x="1138" y="194" class="t">Sequential multi-agent review</text>
  <text x="1138" y="212" class="t">Input: file_content / diff</text>
  <text x="1138" y="230" class="t">Output: findings + recommendations</text>

  <rect x="520" y="265" width="860" height="95" rx="10" fill="#ffffff" stroke="#bef264"/>
  <text x="538" y="290" class="h">code_review_flow</text>
  <text x="538" y="309" class="t">Flow orchestration: SIMPLE path (direct LLM) or COMPLEX path (invokes embedded CodeReviewCrew)</text>
  <text x="538" y="327" class="t">Persists `result.dill` and `flow_state.json` after run</text>
  <text x="538" y="345" class="t">This is a separate workflow module; not called by main Streamlit app path</text>

  <!-- Outputs -->
  <rect x="70" y="470" width="300" height="90" rx="10" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="88" y="495" class="h">`data/checksheets/*.json`</text>
  <text x="88" y="514" class="t">Generated by checksheet_crew</text>
  <text x="88" y="532" class="t">Loaded by app local source mode</text>

  <rect x="390" y="470" width="300" height="90" rx="10" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="408" y="495" class="h">`data/top10/*.json`</text>
  <text x="408" y="514" class="t">Generated by top10_crew</text>
  <text x="408" y="532" class="t">Loaded by app local source mode</text>

  <rect x="710" y="470" width="320" height="90" rx="10" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="728" y="495" class="h">`report/recommendations.md`</text>
  <text x="728" y="514" class="t">Written by agents/main.py path</text>
  <text x="728" y="532" class="t">Crew task output persisted as Markdown</text>

  <rect x="1050" y="470" width="330" height="90" rx="10" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="1068" y="495" class="h">Flow artifacts</text>
  <text x="1068" y="514" class="t">`agents/result.dill`</text>
  <text x="1068" y="532" class="t">`agents/flow_state.json`</text>

  <rect x="70" y="580" width="1310" height="100" rx="10" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="88" y="605" class="h">Consumer Layer</text>
  <text x="88" y="624" class="t">• Streamlit app consumes local JSON outputs and displays review reports.</text>
  <text x="88" y="642" class="t">• Users trigger each crew independently; most crews do not call each other directly.</text>
  <text x="88" y="660" class="t">• Only `code_review_flow` can invoke its embedded `CodeReviewCrew` in COMPLEX route.</text>

  <!-- Agent-level view -->
  <rect x="70" y="785" width="420" height="130" rx="10" fill="#ffffff" stroke="#fdba74"/>
  <text x="88" y="810" class="h">senior_developer agent</text>
  <text x="88" y="829" class="t">Task: analyze_code_quality</text>
  <text x="88" y="847" class="t">Output: critical/minor issues + reasoning</text>

  <rect x="510" y="785" width="420" height="130" rx="10" fill="#ffffff" stroke="#fdba74"/>
  <text x="528" y="810" class="h">security_engineer agent</text>
  <text x="528" y="829" class="t">Task: review_security</text>
  <text x="528" y="847" class="t">Uses SerperDevTool + ScrapeWebsiteTool</text>

  <rect x="950" y="785" width="430" height="130" rx="10" fill="#ffffff" stroke="#fdba74"/>
  <text x="968" y="810" class="h">tech_lead agent</text>
  <text x="968" y="829" class="t">Tasks: make_review_decision / summarize_findings</text>
  <text x="968" y="847" class="t">Consumes previous task context and finalizes output</text>

  <!-- Main interaction arrows -->
  <path class="edge" d="M420 192 L460 192 L460 138 L1120 138 L1120 192"/>
  <text x="710" y="132" class="label">in-app review path</text>

  <path class="edge" d="M420 300 L520 195"/>
  <path class="edge" d="M420 312 L820 195"/>
  <path class="edge" d="M420 324 L1120 205"/>
  <path class="edge" d="M420 336 L520 312"/>
  <text x="448" y="350" class="label">CLI triggers</text>

  <path class="edgeSoft" d="M655 245 L220 470"/>
  <path class="edgeSoft" d="M955 245 L540 470"/>
  <path class="edgeSoft" d="M1240 245 L870 470"/>
  <path class="edgeSoft" d="M950 360 L1215 470"/>

  <path class="edge" d="M220 560 L220 580"/>
  <path class="edge" d="M540 560 L540 580"/>
  <path class="edge" d="M870 560 L870 580"/>

  <!-- Agent chain inside code_review_crew -->
  <path class="edge" d="M490 850 L510 850"/>
  <path class="edge" d="M930 850 L950 850"/>
  <text x="697" y="840" class="label">task context flow</text>

  <!-- No direct crew-to-crew links -->
  <path class="noLink" d="M790 198 L820 198"/>
  <path class="noLink" d="M1090 198 L1120 198"/>
  <text x="830" y="156" class="label">no direct calls between these crews</text>

  <!-- Legend -->
  <rect x="1130" y="25" width="285" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <line x1="1148" y1="45" x2="1200" y2="45" class="edge"/>
  <text x="1210" y="49" class="label">active invocation/data flow</text>
  <line x1="1148" y1="66" x2="1200" y2="66" class="noLink"/>
  <text x="1210" y="70" class="label">no direct interaction</text>
</svg>
